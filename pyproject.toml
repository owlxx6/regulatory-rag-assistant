[project]
name = "rag-reglementaire"
version = "0.1.0"
description = "Assistant documentaire RAG sur corpus réglementaire bancaire, avec citations et abstention mesurées"
requires-python = ">=3.11"

dependencies = [
    # Ingestion
    "pymupdf>=1.24",
    # Embeddings et reranking
    # torch est figé à 2.2.2 : c'est le dernier build officiel pour macOS x86_64 (Mac Intel).
    # Ce binaire est compilé contre NumPy 1.x, d'où la contrainte numpy<2 — sans elle,
    # l'extension C de torch échoue avec « Failed to initialize NumPy: _ARRAY_API not found ».
    # Sur Apple Silicon ou Linux, ces deux bornes peuvent être relevées.
    "torch==2.2.2",
    "numpy<2",
    "sentence-transformers>=3.0",
    # transformers 5.x exige torch >= 2.4, indisponible sur macOS x86_64 : son module
    # tensor_parallel importe torch conditionnellement et échoue ensuite sur NameError.
    "transformers>=4.44,<5",
    # Base
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # Génération
    "anthropic>=0.40",
    "httpx>=0.27",
    # Démonstration
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
