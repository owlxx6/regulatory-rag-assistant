name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # torch est volumineux et n'est pas nécessaire aux tests d'extraction et de découpage,
      # qui n'ont besoin que de pymupdf et du tokenizer. On installe le strict nécessaire
      # pour garder la CI sous la minute.
      - name: Installer les dépendances de test
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pydantic pydantic-settings transformers pytest ruff

      - name: Lint
        run: ruff check src/ scripts/ evaluation/ tests/

      - name: Tests
        run: pytest tests/ -q
        env:
          # Le tokenizer est téléchargé depuis Hugging Face au premier appel.
          HF_HUB_DISABLE_TELEMETRY: "1"
