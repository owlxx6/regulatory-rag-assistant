# Nom explicite : le répertoire du projet contient un espace, qui ferait un nom de
# projet Compose invalide s'il était déduit automatiquement.
name: rag-reglementaire

services:
  db:
    image: pgvector/pgvector:pg16
    # Nom paramétrable : figé, il empêche toute seconde instance — y compris chez qui
    # possède déjà un conteneur de ce nom, ou pour tester le démarrage depuis un clone
    # sans arrêter l'instance de travail. Le défaut reste rag_postgres, de sorte que les
    # commandes `docker exec rag_postgres psql …` du README fonctionnent sans réglage.
    container_name: ${POSTGRES_CONTAINER:-rag_postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Tout fichier .sql de ce répertoire est exécuté au premier démarrage du conteneur,
      # dans l'ordre alphabétique. C'est ce qui rend `docker compose up` suffisant.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
